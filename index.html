<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONYX | My Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #bgParticles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      opacity: 0.8;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(90%, 760px);
      text-align: center;
      padding: 30px 10px;
      background: rgba(12, 12, 12, 0.28);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 24px;
      backdrop-filter: blur(2px);
    }

    h1 {
      font-family: 'Pacifico', 'Segoe Print', 'Bradley Hand', cursive;
      letter-spacing: 2px;
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 400;
      margin-bottom: 8px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #333;
      background: rgba(23, 23, 23, 0.82);
      color: white;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .grid a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 120px;
      padding: 18px 10px;
      background: rgba(23, 23, 23, 0.82);
      border: 1px solid #333;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .grid a:hover {
      background: #292929;
      transform: translateY(-1px);
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.06);
      font-size: 24px;
      line-height: 1;
    }

    .yt { background: rgba(255, 0, 0, 0.12); }
    .games { background: rgba(76, 175, 80, 0.12); }
    .explore { background: rgba(33, 150, 243, 0.12); }
    .google { background: rgba(66, 133, 244, 0.12); }
    .projects { background: rgba(255, 193, 7, 0.12); }
    .movies { background: rgba(233, 30, 99, 0.12); }
    .tiktok { background: rgba(254, 44, 85, 0.12); }
    .news { background: rgba(255, 152, 0, 0.12); }
    .recommendations { background: rgba(91, 156, 255, 0.12); }
  </style>
</head>
<body>
  <canvas id="bgParticles"></canvas>

  <main>
    <h1>ONYX</h1>
    <p>Your personal web hub</p>

    <form action="https://duckduckgo.com/" method="get" target="_blank">
      <input name="q" placeholder="Search the web..." />
    </form>

    <div class="grid">
      <a href="https://www.youtube.com/" target="_blank"><span class="icon yt">▶</span><span>YouTube</span></a>
      <a href="https://www.coolmathgames.com/" target="_blank"><span class="icon games">🎮</span><span>Games</span></a>
      <a href="https://www.wikipedia.org/" target="_blank"><span class="icon explore">🌍</span><span>Explore</span></a>
      <a href="https://www.google.com/" target="_blank"><span class="icon google">🔎</span><span>Google</span></a>
      <a href="https://github.com/" id="projectsLink" target="_blank"><span class="icon projects">💼</span><span>My Projects</span></a>
      <a href="movies.html" target="_blank"><span class="icon movies">🎬</span><span>Movies</span></a>
      <a href="tiktok.html" target="_blank"><span class="icon tiktok">📱</span><span>TikTok</span></a>
      <a href="news.html" target="_blank"><span class="icon news">📰</span><span>News & Help</span></a>
      <a href="recommendations.html" target="_blank"><span class="icon recommendations">⭐</span><span>Recommendations</span></a>
    </div>
  </main>

  <script>
    const projectsLink = document.getElementById('projectsLink');
    const correctPassword = '20140227';

    projectsLink.addEventListener('click', function (event) {
      event.preventDefault();

      const enteredPassword = prompt('Enter password to access My Projects');

      if (enteredPassword === correctPassword) {
        window.open('https://github.com/', '_blank');
      } else {
        alert('Incorrect password. Access denied.');
      }
    });

    const canvas = document.getElementById('bgParticles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticle() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.5 + 0.8,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        alpha: Math.random() * 0.8 + 0.2
      };
    }

    function initParticles() {
      particles = [];
      const particleCount = Math.min(120, Math.max(60, Math.floor((window.innerWidth * window.innerHeight) / 12)));
      for (let i = 0; i < particleCount; i++) {
        particles.push(createParticle());
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i];
          const b = particles[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 110) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255,255,255,${0.18 - dist / 600})`;
            ctx.lineWidth = 1;
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(drawParticles);
    }

    resizeCanvas();
    initParticles();
    drawParticles();

    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });
  </script>
</body>
</html>
