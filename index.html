<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONYX | My Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
    }
    main { width: min(90%, 760px); text-align: center; }
    h1 {
      font-family: 'Pacifico', 'Segoe Print', 'Bradley Hand', cursive;
      letter-spacing: 2px;
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 400;
      margin-bottom: 8px;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #333;
      background: #171717;
      color: white;
      font-size: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .grid a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 120px;
      padding: 18px 10px;
      background: #171717;
      border: 1px solid #333;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .grid a:hover {
      background: #292929;
      transform: translateY(-1px);
    }
    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.06);
      font-size: 24px;
      line-height: 1;
    }
    .yt { background: rgba(255, 0, 0, 0.12); }
    .games { background: rgba(76, 175, 80, 0.12); }
    .explore { background: rgba(33, 150, 243, 0.12); }
    .google { background: rgba(66, 133, 244, 0.12); }
    .projects { background: rgba(255, 193, 7, 0.12); }
    .movies { background: rgba(233, 30, 99, 0.12); }
    .tiktok { background: rgba(254, 44, 85, 0.12); }
    .news { background: rgba(255, 152, 0, 0.12); }
    .discover { background: rgba(156, 39, 176, 0.12); }
  </style>
</head>
<body>
  <main>
    <h1>ONYX</h1>
    <p>Your personal web hub</p>

    <form action="https://www.google.com/search" method="get">
      <input name="q" placeholder="Search the web..." />
    </form>

    <div class="grid">
      <a href="https://www.youtube.com/"><span class="icon yt">▶</span><span>YouTube</span></a>
      <a href="https://www.coolmathgames.com/"><span class="icon games">🎮</span><span>Games</span></a>
      <a href="https://www.wikipedia.org/"><span class="icon explore">🌍</span><span>Explore</span></a>
      <a href="https://www.google.com/"><span class="icon google">🔎</span><span>Google</span></a>
      <a href="https://github.com/" id="projectsLink"><span class="icon projects">💼</span><span>My Projects</span></a>
      <a href="movies.html"><span class="icon movies">🎬</span><span>Movies</span></a>
      <a href="tiktok.html"><span class="icon tiktok">📱</span><span>TikTok</span></a>
      <a href="news.html"><span class="icon news">📰</span><span>News & Help</span></a>
      <a href="https://www.nasa.gov/"><span class="icon discover">🚀</span><span>Discover</span></a>
    </div>
  </main>

  <script>
    const projectsLink = document.getElementById('projectsLink');
    const correctPassword = '20140227';

    projectsLink.addEventListener('click', function (event) {
      event.preventDefault();

      const enteredPassword = prompt('Enter password to access My Projects');

      if (enteredPassword === correctPassword) {
        window.location.href = 'https://github.com/';
      } else {
        alert('Incorrect password. Access denied.');
      }
    });
  </script>
</body>
</html>
