<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONYX | TikTok</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1b1b1b, #090909 60%);
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(90%, 640px);
      background: #171717;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 { letter-spacing: 4px; margin-bottom: 10px; }
    p { color: #d0d0d0; margin: 16px 0 24px; }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    a {
      display: inline-block;
      padding: 16px 22px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      background: #2b2b2b;
      border: 1px solid #444;
    }
    a.primary {
      background: #fe2c55;
      border-color: #fe2c55;
    }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <h1>TIKTOK</h1>
    <p>Open TikTok or head back to the main hub.</p>
    <div class="actions">
      <a class="primary" href="https://www.tiktok.com/" target="_blank" rel="noreferrer">Open TikTok</a>
      <a href="index.html">Back to hub</a>
    </div>
  </div>
</body>
</html>
