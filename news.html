<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONYX | News & Help</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1a1a1a, #090909 60%);
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(90%, 740px);
      background: #171717;
      border: 1px solid #333;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 4px;
      text-align: center;
    }
    .alert {
      background: rgba(255, 152, 0, 0.12);
      border: 1px solid rgba(255, 152, 0, 0.6);
      border-radius: 14px;
      padding: 18px 20px;
      color: #ffe7b3;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    a {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      background: #2b2b2b;
      border: 1px solid #444;
      font-weight: 600;
    }
    a.primary {
      background: #ff9800;
      border-color: #ff9800;
      color: #1a1000;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>NEWS & HELP</h1>
    <div class="alert">
      NEWS: welcome to onyx! DO NOT SHARE THIS WITH ANYONE!! sadly.. the movies page is currently under construction. Please feel free to try any other page!
    </div>
    <div class="actions">
      <a class="primary" href="index.html">Back to hub</a>
      <a href="tiktok.html">Try TikTok</a>
    </div>
  </div>
</body>
</html>
